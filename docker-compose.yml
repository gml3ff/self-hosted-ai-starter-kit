volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

networks:
  demo:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
    # Reverse-proxied by `tailscale serve` on the host; these make n8n generate
    # correct https URLs (webhooks, OAuth callbacks) instead of localhost:5678.
    - N8N_PROTOCOL=https
    - N8N_HOST=spark-primary.tail1a15.ts.net
    - WEBHOOK_URL=https://spark-primary.tail1a15.ts.net/
    - N8N_PROXY_HOPS=1
    - N8N_LICENSE_TENANT_ID=${N8N_LICENSE_TENANT_ID}
    - N8N_LICENSE_ACTIVATION_KEY=${N8N_LICENSE_ACTIVATION_KEY}
  env_file:
    - path: .env
      required: true

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: ['demo']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['demo']
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434
  command:
    - "-c"
    - "sleep 3; ollama pull llama3.2"

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
    - "-c"
    - |
      if [ -z "$(n8n list:workflow --onlyId)" ]; then
        n8n import:credentials --separate --input=/demo-data/credentials && \
        n8n import:workflow --separate --input=/demo-data/workflows
      else
        echo "Workflows exist, skipping import"
      fi
    volumes:
      - ${N8N_DEMO_DATA_DIR:-./n8n/demo-data}:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      # Bound to localhost only: reachability over the tailnet comes from
      # `tailscale serve`, not from exposing this port on the LAN.
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ${N8N_DEMO_DATA_DIR:-./n8n/demo-data}:/demo-data
      - ${N8N_SHARED_DIR:-./shared}:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  nim-chat:
    # Deployed only on spark-secondary (its own idle, single-tenant box) —
    # run with: docker --context spark-secondary compose --profile secondary up -d nim-chat
    # Never targeted at spark-primary: repeatedly locked up that shared box
    # (vLLM's memory profiling grabs ~90% of whatever's "free," which starves
    # the whole machine on GB10's unified-memory architecture when other
    # tenants are also running there).
    profiles: ["secondary"]
    image: nvcr.io/nim/nvidia/llama-3.1-nemotron-nano-8b-v1:1.8.4
    container_name: nim-chat
    restart: unless-stopped
    shm_size: '16gb'
    environment:
      - NGC_API_KEY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Forces the vLLM backend instead of NIM's default TensorRT-LLM pick —
      # TensorRT-LLM's fused-attention kernel has no compiled variant for
      # GB10 (sm_121) and hard-crashes; vLLM works on this chip.
      - NIM_MODEL_PROFILE=4f904d571fe60ff24695b5ee2aa42da58cb460787a968f1e8a09f5a7e862728d
      # GB10 has unified memory (GPU and OS share the same pool). vLLM's
      # default gpu_memory_utilization (0.9) claims ~90% of it for KV cache,
      # starving the OS/sshd/tailscaled — this is what locked up spark-primary
      # three times. NIM's newer UMA auto-clamp (down to 0.5) doesn't apply to
      # this older image, so cap it explicitly and conservatively for an 8B model.
      - NIM_PASSTHROUGH_ARGS=--gpu-memory-utilization 0.3
    ports:
      - 9004:8000
    volumes:
      - ${NIM_CHAT_CACHE_DIR:-./nim-cache/chat}:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  switchyard:
    build:
      context: ./switchyard
    container_name: switchyard
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 127.0.0.1:9005:4000

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
     - ollama-gpu-amd
