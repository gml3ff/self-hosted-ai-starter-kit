# Thin gateway in front of vLLM (vllm-chat on spark-secondary) for clients
# that talk to the model directly, bypassing LiteLLM.
#
# Its one job: refuse /v1/responses with a clean 404. vLLM 0.20 *serves* that
# route but its implementation is broken for agent payloads — its validation
# errors echo the full multimodal input per failed union branch, producing
# multi-GB error bodies (observed: 2.8GB) that killed LiteLLM workers and trip
# the AI SDK's 2GB response cap. n8n's agents runtime probes /v1/responses on
# custom endpoints and only falls back to /v1/chat/completions on 404/405 —
# this gives it that answer.
server {
    listen 8080;

    location = /v1/responses {
        # Without this, nginx's default 1MB limit rejects large agent
        # payloads (growing tool/skill definitions) with 413 before it
        # can even return the clean 404 below.
        client_max_body_size 0;
        default_type application/json;
        return 404 '{"error":{"message":"The Responses API is not available on this endpoint. Use /v1/chat/completions.","type":"invalid_request_error","code":"route_not_found"}}';
    }

    location / {
        proxy_pass http://192.168.100.2:9004;
        proxy_http_version 1.1;
        # Multi-megabyte multimodal bodies: stream, never buffer to disk/RAM.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        # Long generations on a 128k-context model.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
